[build-system]
requires = ["setuptools>=67", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "htir-compiler"
version = "0.1.0"
description = "HTIR: Harness-aware Trace Intermediate Representation compiler"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["harnessfix*"]

[tool.setuptools.package-data]
harnessfix = ["domains/*.yaml"]
