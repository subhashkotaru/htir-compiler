[build-system]
requires = ["setuptools>=67", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "htir"
version = "0.1.0"
description = "Framework-neutral verification for black-box agent trajectories: compile any agent trace into an evidence-carrying verification witness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HTIR contributors" }]
keywords = [
    "llm", "agents", "agent-verification", "trace", "observability",
    "openinference", "opentelemetry", "langchain", "evaluation", "guardrails",
    "process-supervision", "ai-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# LLM-backed semantic checks / analysis are optional; the deterministic
# pipeline (ingest -> graph -> mechanical checks -> witness) needs none of it.
llm = ["openai>=1.30.0", "python-dotenv>=1.0.0"]
# Evaluation harness (htir.eval): the Hugging Face `datasets` loader is only
# needed to pull the Terminal-Bench corpus; local JSON/JSONL samples need none.
eval = ["datasets>=2.14.0"]
# Track M live capture only (scripts/live_meta_harness_tb2.py -> `harbor run`
# against Terminal-Bench 2.0). Deliberately NOT a dependency of htir core --
# see that script's module docstring. Pinned to what this repo's capture was
# actually run and validated against (2026-07-17, macOS arm64, Python 3.12);
# `pip install --only-binary=:all: "htir[live]"` avoids a Rust-toolchain
# build failure some of harbor's own transitive deps can hit otherwise.
live = ["harbor==0.19.0", "litellm==1.91.3", "anthropic==0.117.0", "tenacity==9.1.4", "python-dotenv>=1.0.0"]
# Track S: SkillOpt training loop (scripts/skillopt_train_tb2.py). Rollouts
# still need the live extra (harbor); this extra is only the optimizer package.
skillopt = ["skillopt>=0.2.0"]
dev = ["pytest>=7.0", "openai>=1.30.0", "python-dotenv>=1.0.0", "datasets>=2.14.0"]

[project.scripts]
htir = "htir.cli:main"

# Extension-point groups: third-party packages can add a framework adapter or
# a mechanical checker by advertising an entry point here (loaded via
# htir.adapters.load_entry_point_adapters / checker_registry.load_entry_point_checkers).
[project.entry-points."htir.adapters"]
# example = "my_pkg.htir_adapter"

[project.entry-points."htir.checkers"]
# example = "my_pkg.htir_checker"

[project.urls]
Homepage = "https://github.com/htir/htir"
Repository = "https://github.com/htir/htir"
Issues = "https://github.com/htir/htir/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["htir*"]

[tool.setuptools.package-data]
htir = ["domains/*.yaml", "domains/*.yml", "domains/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
